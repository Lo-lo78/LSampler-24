name: Build LSampler-24 VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release 0.99.27 version, About, Help and artifact metadata
        shell: powershell
        run: |
          python Tools/verify-release-0_99_27.py
          if ($LASTEXITCODE -ne 0) { throw "LSampler-24 0.99.27 release metadata mismatch." }

      - name: Verify TEST185 Windows Python UTF-8 file decoding
        shell: powershell
        run: |
          python Tools/verify-test185-windows-utf8.py
          if ($LASTEXITCODE -ne 0) { throw "TEST185 Python UTF-8 verification failed." }

      - name: Verify frozen TEST59 reference
        shell: powershell
        run: |
          python Tools/verify-test59-reference.py
          if ($LASTEXITCODE -ne 0) { throw "Frozen TEST59 reference verification failed." }

      - name: Verify TEST163 MIDI channel routing
        shell: powershell
        run: |
          python Tools/verify-test163-midi-routing.py
          if ($LASTEXITCODE -ne 0) { throw "TEST163 MIDI routing verification failed." }

      - name: Verify TEST164 keyboard prefix search and release metadata
        shell: powershell
        run: |
          python Tools/verify-test164-incremental-search.py
          if ($LASTEXITCODE -ne 0) { throw "TEST164 incremental search verification failed." }

      - name: Verify TEST165 LReaParams search parity
        shell: powershell
        run: |
          python Tools/verify-test165-lreaparams-parity.py
          if ($LASTEXITCODE -ne 0) { throw "TEST165 LReaParams search parity verification failed." }

      - name: Verify TEST166 de-click and Sample Window constraints
        shell: powershell
        run: |
          python Tools/verify-test166-declick-bounds.py
          if ($LASTEXITCODE -ne 0) { throw "TEST166 de-click / Sample Window check failed." }

      - name: Verify TEST168 native REAPER clipboard integration
        shell: powershell
        run: |
          python Tools/verify-test168-native-clipboard.py
          if ($LASTEXITCODE -ne 0) { throw "TEST168 native REAPER clipboard check failed." }

      - name: Verify TEST169 SWS audio source path clipboard integration
        shell: powershell
        run: |
          python Tools/verify-test169-sws-source-paths.py
          if ($LASTEXITCODE -ne 0) { throw "TEST169 SWS path clipboard check failed." }

      - name: Verify TEST186 LFO Drift and Lace (Mono, Poly, deterministic)
        shell: powershell
        run: |
          python Tools/verify-test186-lfo-polyrhythm.py
          if ($LASTEXITCODE -ne 0) { throw "TEST186 LFO Drift/Lace regression failed." }

      - name: Verify TEST170 deterministic Free LFO on DAW Play
        shell: powershell
        run: |
          python Tools/verify-test170-free-lfo-play.py
          if ($LASTEXITCODE -ne 0) { throw "TEST170 Free LFO Play reset check failed." }

      - name: Verify TEST172 Alt+S complete slot preview
        shell: powershell
        run: |
          python Tools/verify-test172-alt-s-layer-preview.py
          if ($LASTEXITCODE -ne 0) { throw "TEST172 Alt+S preview check failed." }

      - name: Verify TEST173 per-sample controls and shared Start End timeline
        shell: powershell
        run: |
          python Tools/verify-test173-sample-timeline.py
          if ($LASTEXITCODE -ne 0) { throw "TEST173 sample timeline verification failed." }

      - name: Verify TEST184 Windows-compatible media reader declaration
        shell: powershell
        run: |
          python Tools/verify-test184-media-reader-declaration.py
          if ($LASTEXITCODE -ne 0) { throw "TEST184 MediaPasteExpansion C++ declaration check failed." }

      - name: Build TEST62, compare audio and measure performance
        id: compare
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File Tools/build-windows.ps1

      - name: Add audio and performance report to summary
        if: always()
        shell: powershell
        run: |
          $reportPath = "build\make-release\filter-reports\FILTER_TEST62_REPORT.txt"
          if (Test-Path -LiteralPath $reportPath) {
            '```text' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Get-Content -LiteralPath $reportPath | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } else {
            "TEST62 did not reach audio comparison. Read the failed build step." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload audio comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LSampler-24-TEST62-Reports
          path: |
            build/make-release/filter-reports/
            build/make-release/Testing/Temporary/
          if-no-files-found: warn

      - name: Verify TEST174 shared Sample Set thresholds
        shell: powershell
        run: |
          python Tools/verify-test174-threshold-window.py
          if ($LASTEXITCODE -ne 0) { throw "TEST174 threshold verification failed." }

      - name: Verify TEST175 MIDI learn and SWS chromatic note mapping
        shell: powershell
        run: |
          python Tools/verify-test175-midi-learn-sws-mapping.py
          if ($LASTEXITCODE -ne 0) { throw "TEST175 MIDI learn and SWS mapping verification failed." }

      - name: Verify TEST176 direct REAPER item selection and trim geometry
        shell: powershell
        run: |
          python Tools/verify-test176-selected-reaper-items.py
          if ($LASTEXITCODE -ne 0) { throw "TEST176 REAPER direct item import verification failed." }

      - name: Verify TEST177 background source window and compact host state
        shell: powershell
        run: |
          python Tools/verify-test177-background-source-window.py
          if ($LASTEXITCODE -ne 0) { throw "TEST177 compact async REAPER import verification failed." }

      - name: Verify TEST178 nonblocking REAPER item import and NVDA focus
        shell: powershell
        run: |
          python Tools/verify-test178-nonblocking-import.py
          if ($LASTEXITCODE -ne 0) { throw "TEST178 nonblocking import verification failed." }

      - name: Verify TEST180 deterministic cross-session chromatic paste
        shell: powershell
        run: |
          python Tools/verify-test180-chromatic-paste.py
          if ($LASTEXITCODE -ne 0) { throw "TEST180 deterministic paste verification failed." }

      - name: Verify TEST181 occupied-slot overwrite decisions and relocation
        shell: powershell
        run: |
          python Tools/verify-test181-overwrite-choice.py
          if ($LASTEXITCODE -ne 0) { throw "TEST181 occupied-slot paste verification failed." }

      - name: Verify TEST182 video audio extraction and multichannel stereo-pair imports
        shell: powershell
        run: |
          python Tools/verify-test182-media-expansion.py
          if ($LASTEXITCODE -ne 0) { throw "TEST182 media extraction check failed." }

      - name: Verify TEST183 extracted audio cache cleanup UI and guards
        shell: powershell
        run: |
          python Tools/verify-test183-cache-cleanup.py
          if ($LASTEXITCODE -ne 0) { throw "TEST183 extracted cache cleanup check failed." }

      - name: Package LSampler-24 v0.99.27 VST3 after audio comparison passes
        if: success() && steps.compare.outcome == 'success'
        shell: powershell
        run: |
          $vst3 = "build\make-release\LSampler24_artefacts\Release\VST3\LSampler-24.vst3"
          if (-not (Test-Path -LiteralPath $vst3)) { throw "VST3 bundle not found: $vst3" }
          @(
            "LSampler-24 v0.99.27 - Windows x64 VST3.",
            "Build date: 14 November 2026.",
            "24-slot sampler with Sample Sets, accessible Help (8 languages) and About.",
            "TEST166: 3 ms voice de-click, 1 ms legato pitch transition and bounded Sample Start/End.",
            "TEST169: SWS/BR audio source paths copied to clipboard, import full files with slot-grid Alt+V.",
            "TEST170: Free LFO 1/2 restart on DAW Play in Mono/Poly with repeatable Sample & Hold; Triggered unchanged.",
            "TEST165: LReaParams-compatible keyboard search and TEST163 MIDI routing preserved.",
            "TEST174: apply Start/End Threshold to the combined Sample Set timeline.",
            "TEST175: focused MIDI Low/High Key learn; first import starts at MIDI 60 if no mapped predecessor exists.",
            "TEST176: Alt+V imports selected REAPER items directly without Ctrl+C or SWS, preserving ordinary take trims.",
            "TEST176: Original Pitch follows Low/High Key; complex REAPER transforms are skipped.",
            "TEST177: direct item import decodes audio on file worker with per-chunk accessible progress.",
            "TEST177: consecutive cuts of the same file share one temporary source decode.",
            "TEST177: source-window metadata replaces huge embedded audio in VST3 project snapshots; host snapshots skip sync SHA.",
            "TEST178: background preparation of threshold/DSP for REAPER items; per-slot snapshot cache avoids repeated bank rescans.",
            "TEST178: no forced NVDA Status focus on REAPER Alt+V; accessible progress and Escape preserved.",
            "TEST179: Alt+V imports copied Windows Explorer audio files using CF_HDROP and the same background loader.",
            "TEST180: REAPER/Explorer Alt+V continues from saved chromatic slot mapping; gaps and replacements supported.",
            "TEST180: 127-note MIDI range enforced without clamping duplicate last notes.",
            "TEST181: Per-occupied-slot Y to replace, N to keep audio and move same source to next free slot; Escape aborts paste.",
            "TEST181: Source order preserved; continue on first unused MIDI key, respecting all occupied Low/High Key zones.",
            "TEST182: AAC/video extracts first audio stream with Windows Media Foundation; supported JUCE multichannel audio splits into consecutive stereo pairs.",
            "TEST182: Persistent extracted WAV files live in user application data; copy them with a project on transfer.",
            "TEST182: Stereo pairs count separately towards the 24-slot chromatic plan; Y/N/Escape confirmation remains.",
            "TEST183: Advanced menu can open extracted audio cache and clear generated WAVs on request only.",
            "TEST183: Confirmation warns about closed projects; files referenced by open LSampler instances are protected.",
            "TEST184: Fix MSVC compile C4430/C2059 in MediaPasteExpansion reader declaration; DSP/features unchanged.",
            "TEST185: Windows Python cache-verification scripts read UTF-8 explicitly; PYTHONUTF8=1 in CI; no DSP changes.",
            "v0.99.27 TEST186: LFO1/2 Drift and Lace in all 24 Slots; Mono/Poly, Self-Lace and deterministic Free LFO restart.",
            "Commit: $env:GITHUB_SHA",
            "Audio parity with TEST59 passed for the automated test scenarios.",
            "Performance measurements are in LSampler-24-TEST62-Reports."
          ) | Set-Content -LiteralPath "BUILD_0.99.27.txt" -Encoding UTF8
          Compress-Archive -Path $vst3, "BUILD_0.99.27.txt", "TEST169_SWS_COPY_SOURCE_PATHS_NOTE_IT.txt", "TEST170_FREE_LFO_HOST_PLAY_NOTE_IT.txt", "RELEASE_TEST176.md", "RELEASE_TEST177.md", "RELEASE_TEST178.md", "RELEASE_TEST179.md", "RELEASE_TEST180.md", "RELEASE_TEST181.md", "RELEASE_TEST182.md", "RELEASE_TEST183.md", "RELEASE_TEST184.md", "RELEASE_TEST185.md", "RELEASE_0.99.27.md", "Help/LSampler24Help.html" -DestinationPath "LSampler-24.0.99.27.vst3.zip" -Force

      - name: Upload LSampler-24 0.99.27 VST3
        if: success() && steps.compare.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: LSampler-24.0.99.27.vst3
          path: LSampler-24.0.99.27.vst3.zip
          if-no-files-found: error
