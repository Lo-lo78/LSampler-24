name: Build LSampler-24 VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frozen TEST59 reference
        shell: powershell
        run: |
          python Tools/verify-test59-reference.py
          if ($LASTEXITCODE -ne 0) { throw "Frozen TEST59 reference verification failed." }

      - name: Verify TEST163 MIDI channel routing
        shell: powershell
        run: |
          python Tools/verify-test163-midi-routing.py
          if ($LASTEXITCODE -ne 0) { throw "TEST163 MIDI routing verification failed." }

      - name: Verify TEST164 keyboard prefix search and release metadata
        shell: powershell
        run: |
          python Tools/verify-test164-incremental-search.py
          if ($LASTEXITCODE -ne 0) { throw "TEST164 incremental search verification failed." }

      - name: Verify TEST165 LReaParams search parity
        shell: powershell
        run: |
          python Tools/verify-test165-lreaparams-parity.py
          if ($LASTEXITCODE -ne 0) { throw "TEST165 LReaParams search parity verification failed." }

      - name: Verify TEST166 de-click and Sample Window constraints
        shell: powershell
        run: |
          python Tools/verify-test166-declick-bounds.py
          if ($LASTEXITCODE -ne 0) { throw "TEST166 de-click / Sample Window check failed." }

      - name: Build TEST62, compare audio and measure performance
        id: compare
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File Tools/build-windows.ps1

      - name: Add audio and performance report to summary
        if: always()
        shell: powershell
        run: |
          $reportPath = "build\make-release\filter-reports\FILTER_TEST62_REPORT.txt"
          if (Test-Path -LiteralPath $reportPath) {
            '```text' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Get-Content -LiteralPath $reportPath | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } else {
            "TEST62 did not reach audio comparison. Read the failed build step." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload audio comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LSampler-24-TEST62-Reports
          path: |
            build/make-release/filter-reports/
            build/make-release/Testing/Temporary/
          if-no-files-found: warn

      - name: Package TEST166 VST3 after audio comparison passes
        if: success() && steps.compare.outcome == 'success'
        shell: powershell
        run: |
          $vst3 = "build\make-release\LSampler24_artefacts\Release\VST3\LSampler-24.vst3"
          if (-not (Test-Path -LiteralPath $vst3)) { throw "VST3 bundle not found: $vst3" }
          @(
            "LSampler-24 v0.99.25 TEST166 - Windows x64 VST3.",
            "Release date: 4 November 2026.",
            "24-slot sampler with Sample Sets, accessible Help (8 languages) and About.",
            "TEST166: anti-click 3 ms crossfades on replaced notes, 1 ms zero-portamento mono legato pitch transition, mutually bounded Sample Start/End.",
            "TEST165: LReaParams-compatible keyboard search and TEST163 MIDI routing preserved.",
            "Commit: $env:GITHUB_SHA",
            "Audio parity with TEST59 passed for the automated test scenarios.",
            "Performance measurements are in LSampler-24-TEST62-Reports."
          ) | Set-Content -LiteralPath "BUILD_TEST166.txt" -Encoding UTF8
          Compress-Archive -Path $vst3, "BUILD_TEST166.txt" -DestinationPath "LSampler-24-Windows-VST3-TEST166.zip" -Force

      - name: Upload TEST166 VST3
        if: success() && steps.compare.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: LSampler-24-Windows-VST3-TEST166
          path: LSampler-24-Windows-VST3-TEST166.zip
          if-no-files-found: error
